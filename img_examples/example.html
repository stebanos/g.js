<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>g.js imaging examples</title>
    <script src="../build/g.js"></script>
    <script>
        /* global g */
        'use strict';

        document.addEventListener('DOMContentLoaded', () => {
            const img1 = 'images/img1.jpg';
            const img2 = 'images/img2.jpg';
            g.loadImages([img1, img2], (images) => {
                const iCanvas = new g.ImageCanvas(600, 450);
                let layer = iCanvas.addLayer(images[img1]);
                layer.addFilter('rgbAdjust', {r: 0.25, g: 0.25});
                layer = iCanvas.addLayer(images[img2]);
                layer.addFilter('rgbAdjust', {r: 0.30, g: -0.10, b: -0.15});
                layer.addFilter('invert');
                layer.opacity = 0.3;
                document.body.appendChild(iCanvas.render());
            });
        });
    </script>
</head>
<body id="root">
</body>
</html>
