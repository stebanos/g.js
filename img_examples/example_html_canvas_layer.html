<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>g.js - Example canvas as mask layer</title>
    <script src="../build/g.js"></script>
    <script>
        /* global g */
        'use strict';

        function drawEllipseByCenter(ctx, cx, cy, w, h) {
            drawEllipse(ctx, cx - w / 2.0, cy - h / 2.0, w, h);
        }

        function drawEllipse(ctx, x, y, w, h) {
            const kappa = 0.5522848;
            const ox = (w / 2) * kappa; // control point offset horizontal
            const oy = (h / 2) * kappa; // control point offset vertical
            const xe = x + w;           // x-end
            const ye = y + h;           // y-end
            const xm = x + w / 2;       // x-middle
            const ym = y + h / 2;       // y-middle

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, ym);
            ctx.bezierCurveTo(x, ym - oy, xm - ox, y, xm, y);
            ctx.bezierCurveTo(xm + ox, y, xe, ym - oy, xe, ym);
            ctx.bezierCurveTo(xe, ym + oy, xm + ox, ye, xm, ye);
            ctx.bezierCurveTo(xm - ox, ye, x, ym + oy, x, ym);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const img1 = 'images/img1.jpg';
            const img2 = 'images/img2.jpg';
            g.loadImages([img1, img2], (images) => {
                const w = 360;
                const h = 360;
                const iCanvas = new g.ImageCanvas(600, 450);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const iCanvas2 = new g.ImageCanvas(650, 500);
                let layer = iCanvas.addLayer(images[img1]);
                layer.addFilter('rgbAdjust', {r: 0.25, g: 0.25});
                layer = iCanvas.addLayer(images[img2]);
                layer.addFilter('rgbAdjust', {r: 0.30, g: 0.20, b: 0.35});

                canvas.width = w;
                canvas.height = h;
                ctx.fillStyle = 'grey';
                drawEllipseByCenter(ctx, w / 2, h / 2, w, h);
                layer.mask.addLayer(canvas);

                iCanvas2.addLayer('black', 'cornflowerblue', 90, 0.65);
                layer = iCanvas2.addLayer('black', 'gold', 270, 0.65);
                layer.blendmode = 'screen';
                layer = iCanvas2.addLayer('black', 'crimson', 0, 0.65);
                layer.blendmode = 'screen';
                layer = iCanvas2.addLayer('black', 'honeydew', 180, 0.65);
                layer.blendmode = 'screen';
                layer = iCanvas2.addLayer(iCanvas);
                layer.blendmode = 'lighten';

                document.body.appendChild(iCanvas2.render());
            });
        });
    </script>
</head>
<body id="root">
</body>
</html>
