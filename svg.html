<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>g.js SVG notebook</title>
    <script src="build/g.js"></script>

    <script>
        // Live reload when served by `npm run dev` (esbuild dev server on :8000).
        // No-op for static/production hosting on other ports.
        if (window.location.port === '8000') {
            new EventSource('/esbuild').addEventListener('change', () => location.reload());
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            font-size: 12px;
        }

        .header {
            position: relative;
            height: 40px;
            left: 0;
            right: 0;
            background: #81be97;
            color: #d9ebe0;
            border-bottom: 1px solid #4d9567;
        }

        .header h2 {
            display: inline-block;
            margin: 0;
            padding: 10px;
        }

        .btn {
            background: #c2dfcd;
            color: #888;
            margin: 0;
            padding: 6px;
            line-height: 1.8em;
        }

        .btn div {
            position: relative;
            display: inline-block;
            padding: 5px;
            line-height: 1em;
            color: #519c6c;
        }

        .btn button {
            position: relative;
            margin-left: 48%;
            display: inline-block;
            padding: 5px;
            background: #81be97;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            line-height: 1em;
            color: #d9ebe0;
        }

        #ta {
            position: absolute;
            width: 48%;
            height: 85%;
            border: none;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            color: purple;
        }

        #canvasarea {
            width: 50%;
            height: 87%;
            position: absolute;
            left: 50%;
            border-left: 1px solid lightgray;
        }

        #canvasarea canvas {
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>
    <div class="header">
        <h2>g.js SVG notebook</h2>
    </div>
    <div class="btn">
        <div>SVG</div>
        <button id="render">Render</button>
    </div>
    <textarea id="ta"></textarea>
    <div id="canvasarea">
        <canvas id="c"></canvas>
    </div>

<script>
    /* global g */
    'use strict';

    function render() {
        const source = document.querySelector('#ta').value;
        const result = g.svg.parseString(source);
        const bounds = g.bounds(result);
        const canvasArea = document.querySelector('#canvasarea');
        const canvas = document.querySelector('#c');
        const width = canvas.width = canvasArea.clientWidth;
        const height = canvas.height = canvasArea.clientHeight;
        const ctx = canvas.getContext('2d');
        ctx.translate((width - bounds.width) / 2, (height - bounds.height) / 2);
        g.draw(ctx, result);
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('#ta').value = [
            '<svg>',
            '    <rect x="10" y="10" width="180" height="120" fill="cornflowerblue" stroke="navy" stroke-width="4"/>',
            '    <circle cx="100" cy="70" r="40" fill="gold"/>',
            '</svg>'
        ].join('\n');
        document.querySelector('#render').addEventListener('click', render);
        render();
    });
</script>

</body>
</html>
